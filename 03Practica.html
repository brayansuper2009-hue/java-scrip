<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>MENU </title>
</head>
<body onload="calcularSalarioNeto">
   
<nav class="navbar fg-2 bg-primary">
<div class="container-fluid">
  <a class="navbar-brand" href="index.html">
    <img src="img/firefly.jpg" alt="Logo" width="30"height="24" class="d-inline-block align-text-top">
    MENU
  </a>
</div>
</nav>
<div class="container text-center">
    <div class="display-2"><h2> Salario Neto </h2></div>
    <table class="table">
        <tr>
            <td> Puesto </td>
            <td> Horas </td>
            <td> Años </td>
        </tr>

        <tr>
            <td>
            <select id="puesto" class="form-control" onchange="calcularSalarioNeto()">
                <option value="1"> Gerente </option>
                <option value="2"> Secretaria </option>
                <option value="3"> Cajero </option>
            </select>
        </td>
            <td>
                <select id="horas" class="form-control" onchange="calcularSalarioNeto()" >
                    <script>
                       for (var i = 0; i <=50; i++) {
            document.write("<option value='"+i+"'>"+i+
                "</option>");
            }
                    </script>
                </select>
            </td>

            <td>
                <select id="anios" class="form-control" onchange="calcularSalarioNeto()">
                    <script>
                       for (var i = 0; i <=40; i++) {
            document.write("<option value='"+i+"'>"+i+
                "</option>");
            }
                    </script>
                </select>
            </td>
        </tr>
    </table>

    <table class="table">
        <tr>
            <td colspan="2"> <h2> PERCEPCIONES </h2></td>
            <td colspan="2"> <h2> DEDUCCIONES </h2></td>
        </tr>
         <tr>
            <td> Sueldo base </td>
            <td> <span id="sueldoBase">  </span> </td>
            <td> ISR </td>
            <td> <span id="ISR"></span></td>
        </tr>
         <tr>
            <td> Canasta Basica </td>
            <td> <span id="canastaBasica"></span></td>
            <td> Servicios de Salud </td>
            <td> <span id="ServicioSalud"></span></td>
        </tr>
         <tr>
            <td> Apoyos </td>   
            <td> <span id="apoyo"></span></td>
            <td> AFORE</td>
            <td> <span id="afore"></span></td>
        </tr>
         <tr>
            <td> Antiguedad </td>
            <td> <span id="antiguedad"></span></td>
            <td> Sindicato </td>
            <td> <span id="sindicato"></span> </td>
        </tr>
         <tr>
            <td> Estimulo </td>
            <td> <span id="estimulo"></span></td>
            <td></td>
            <td></td>
        </tr>
         <tr>
            <td> <h4> TOTAL PERCEPCIONES </h4> </td>
            <td> <span id="totalPercepciones"></span></td>
            <td> <h4> TOTAL DEDUCCIONES  </h4> </td>
            <td> <span id="totalDeucciones"></span></td>
        </tr>
         <tr> 
            <td colspan="2"> <h4> SALARIO NETO </h4> </td>
            <td colspan="2"> <span id="salarioNeto"></span> </td>
        </tr>
    </table>
</div>



    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/03appSalarioNeto.js"></script>
</body>
</html>
